[tool.poetry]
name = "fetaqa-e2e"
version = "0.1.0"
description = "End-to-end FetaQA question answering system"
authors = ["Your Name <your.email@example.com>"]
readme = "README.md"
packages = [{include = "end2end"}, {include = "pipeline"}]

[tool.poetry.dependencies]
python = "^3.8"
torch = "^1.7.0"
transformers = "^4.0.0"
datasets = "^1.0.0"
pandas = "^1.2.0"
numpy = "^1.20.0"
nltk = "^3.5"
requests = "^2.25.0"
tqdm = "^4.49.0"
tokenizers = "^0.10.0"
sacrebleu = "^1.5.0"
sacremoses = "^0.0.43"
sentencepiece = "^0.1.90"
flask = "^1.1.0"
click = "^7.1.0"
jinja2 = "^2.11.0"
werkzeug = "^1.0.0"
tensorboardx = "^2.4"
protobuf = "^3.13.0"
pyarrow = "^3.0.0"
regex = "*"
python-dateutil = "^2.8.0"
pytz = "^2021.1"
urllib3 = "^1.26.0"
certifi = "^2020.12.0"
chardet = "^4.0.0"
idna = "^2.10"
packaging = "^20.9"
pyparsing = "^2.4.0"
filelock = "^3.0.0"
fsspec = "^0.8.0"
huggingface-hub = "*"
importlib-metadata = "^3.4.0"
itsdangerous = "^1.1.0"
joblib = "^1.0.0"
markupsafe = "*"
multiprocess = "^0.70.11"
portalocker = "^2.2.0"
dill = "^0.3.0"
xxhash = "^2.0.0"
zipp = "^3.4.0"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.0"
pytest-cov = "^4.1.0"
pytest-mock = "^3.11.1"

[tool.poetry.scripts]
test = "pytest"
tests = "pytest"

[tool.pytest.ini_options]
minversion = "6.0"
addopts = [
    "--strict-markers",
    "--strict-config",
    "--verbose",
    "--cov=end2end",
    "--cov=pipeline", 
    "--cov-report=term-missing",
    "--cov-report=html:htmlcov",
    "--cov-report=xml:coverage.xml"
]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "unit: Unit tests",
    "integration: Integration tests", 
    "slow: Slow running tests"
]

[tool.coverage.run]
source = ["end2end", "pipeline"]
omit = [
    "*/tests/*",
    "*/test_*.py", 
    "*/*_test.py",
    "*/conftest.py",
    "*/__pycache__/*",
    "*/.*",
    "setup.py"
]

[tool.coverage.report]
show_missing = true
skip_covered = false
precision = 2
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod"
]

[tool.coverage.html]
directory = "htmlcov"

[tool.coverage.xml]
output = "coverage.xml"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"